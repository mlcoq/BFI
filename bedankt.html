<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aanvraag ontvangen | BFI</title>
    <meta name="robots" content="noindex">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #1d4ed8;
            --accent-hover: #1e40af;
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Manrope', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
            color: #e2e8f0;
            -webkit-font-smoothing: antialiased;
            background:
                radial-gradient(ellipse 80% 60% at 15% 20%, rgba(37, 99, 235, 0.35), transparent 55%),
                radial-gradient(ellipse 70% 50% at 85% 75%, rgba(14, 165, 233, 0.18), transparent 50%),
                linear-gradient(160deg, #0b1220 0%, #132038 45%, #0f172a 100%);
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(148, 163, 184, 0.08) 1px, transparent 1px),
                linear-gradient(90deg, rgba(148, 163, 184, 0.08) 1px, transparent 1px);
            background-size: 56px 56px;
            mask-image: radial-gradient(ellipse 70% 65% at 50% 40%, black 20%, transparent 75%);
            pointer-events: none;
        }
        .panel {
            position: relative;
            z-index: 1;
            max-width: 520px;
            width: 100%;
            padding: 40px 32px;
            border-radius: 20px;
            background: rgba(15, 23, 42, 0.55);
            border: 1px solid rgba(148, 163, 184, 0.2);
            backdrop-filter: blur(10px);
            animation: rise-in 0.7s ease both;
        }
        .brand {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            margin: 0 auto 28px;
            text-decoration: none;
            line-height: 1;
        }
        .brand-mark {
            font-size: clamp(1.6rem, 4vw, 2rem);
            font-weight: 800;
            letter-spacing: -0.03em;
            color: #60a5fa;
            line-height: 1;
        }
        .brand-flow {
            display: block;
            width: min(100%, 10rem);
            height: 12px;
            overflow: visible;
        }
        .brand-tag {
            color: #94a3b8;
            font-weight: 500;
            font-size: 0.75rem;
            letter-spacing: 0.02em;
            line-height: 1.35;
        }
        h1 {
            color: #f8fafc;
            font-size: clamp(1.75rem, 4vw, 2.1rem);
            font-weight: 800;
            letter-spacing: -0.03em;
            margin-bottom: 14px;
        }
        p {
            font-size: 1.1rem;
            line-height: 1.7;
            color: #94a3b8;
            margin-bottom: 32px;
        }
        a {
            display: inline-block;
            background: var(--accent);
            color: #fff;
            font-weight: 700;
            padding: 14px 28px;
            border-radius: 10px;
            text-decoration: none;
            box-shadow: 0 8px 24px rgba(29, 78, 216, 0.35);
            transition: transform 0.2s ease, background-color 0.2s ease;
        }
        a:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
        }
        @keyframes rise-in {
            from { opacity: 0; transform: translateY(14px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="panel">
        <a class="brand" href="/">
            <span class="brand-mark">BFI</span>
            <svg class="brand-flow" viewBox="0 0 140 14" fill="none" aria-hidden="true">
                <defs>
                    <linearGradient id="brandFlowThanks" x1="0" y1="7" x2="140" y2="7" gradientUnits="userSpaceOnUse">
                        <stop stop-color="#60a5fa"/>
                        <stop offset="0.55" stop-color="#93c5fd"/>
                        <stop offset="1" stop-color="#93c5fd" stop-opacity="0.25"/>
                    </linearGradient>
                </defs>
                <path d="M1 9C18 9 28 3.5 42 4.5C56 5.5 62 11 78 10C94 9 104 3 122 4.5L132 5.5" stroke="url(#brandFlowThanks)" stroke-width="2.2" stroke-linecap="round"/>
                <path d="M128 2.2L135.5 5.6L128 9" stroke="#93c5fd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span class="brand-tag">Business Flow Intelligence</span>
        </a>
        <h1>Aanvraag ontvangen</h1>
        <p>We nemen persoonlijk contact met u op om uw AI-Scan in te plannen.</p>
        <a href="/">Terug naar bfi.nl</a>
    </div>
</body>
</html>
