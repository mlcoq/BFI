<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aanvraag ontvangen | BFI</title>
    <meta name="robots" content="noindex">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #1d4ed8;
            --accent-hover: #1e40af;
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Manrope', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
            color: #e2e8f0;
            -webkit-font-smoothing: antialiased;
            background:
                radial-gradient(ellipse 80% 60% at 15% 20%, rgba(37, 99, 235, 0.35), transparent 55%),
                radial-gradient(ellipse 70% 50% at 85% 75%, rgba(14, 165, 233, 0.18), transparent 50%),
                linear-gradient(160deg, #0b1220 0%, #132038 45%, #0f172a 100%);
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(148, 163, 184, 0.08) 1px, transparent 1px),
                linear-gradient(90deg, rgba(148, 163, 184, 0.08) 1px, transparent 1px);
            background-size: 56px 56px;
            mask-image: radial-gradient(ellipse 70% 65% at 50% 40%, black 20%, transparent 75%);
            pointer-events: none;
        }
        .panel {
            position: relative;
            z-index: 1;
            max-width: 520px;
            width: 100%;
            padding: 40px 32px;
            border-radius: 20px;
            background: rgba(15, 23, 42, 0.55);
            border: 1px solid rgba(148, 163, 184, 0.2);
            backdrop-filter: blur(10px);
            animation: rise-in 0.7s ease both;
        }
        .brand {
            display: inline-flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 7px;
            margin: 0 auto 28px;
            text-decoration: none;
            line-height: 1;
            background: #f4f7fb;
            padding: 14px 16px;
            border-radius: 12px;
        }
        .brand-mark {
            font-size: clamp(1.85rem, 4.2vw, 2.35rem);
            font-weight: 800;
            letter-spacing: -0.04em;
            color: #0f172a;
            line-height: 1;
            border-bottom: 1.5px solid #2563eb;
            padding-bottom: 7px;
        }
        .brand-tag {
            font-weight: 600;
            font-size: clamp(0.72rem, 1.5vw, 0.82rem);
            letter-spacing: 0.08em;
            text-transform: uppercase;
            line-height: 1.35;
            color: #64748b;
            white-space: nowrap;
        }
        h1 {
            color: #f8fafc;
            font-size: clamp(1.75rem, 4vw, 2.1rem);
            font-weight: 800;
            letter-spacing: -0.03em;
            margin-bottom: 14px;
        }
        p {
            font-size: 1.1rem;
            line-height: 1.7;
            color: #94a3b8;
            margin-bottom: 32px;
        }
        .btn {
            display: inline-block;
            background: var(--accent);
            color: #fff;
            font-weight: 700;
            padding: 14px 28px;
            border-radius: 10px;
            text-decoration: none;
            box-shadow: 0 8px 24px rgba(29, 78, 216, 0.35);
            transition: transform 0.2s ease, background-color 0.2s ease;
        }
        .btn:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
        }
        @keyframes rise-in {
            from { opacity: 0; transform: translateY(14px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="panel">
        <a class="brand" href="/">
            <span class="brand-mark">BFI</span>
            <span class="brand-tag">Business Flow Intelligence</span>
        </a>
        <h1>Aanvraag ontvangen</h1>
        <p>We nemen persoonlijk contact met u op om uw AI-Scan in te plannen.</p>
        <a href="/" class="btn">Terug naar bfi.nl</a>
    </div>
</body>
</html>
