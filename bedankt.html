<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bedankt | BFI</title>
    <meta name="robots" content="noindex">
    <style>
        :root {
            --primary: #0f172a;
            --accent: #2563eb;
            --text-main: #334155;
            --bg-light: #f8fafc;
            --white: #ffffff;
            --border: #e2e8f0;
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: var(--text-main);
            background: var(--bg-light);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
        }
        .card {
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 48px 40px;
            max-width: 520px;
            width: 100%;
        }
        h1 {
            color: var(--primary);
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            margin-bottom: 16px;
        }
        p {
            font-size: 1.125rem;
            line-height: 1.7;
            margin-bottom: 32px;
        }
        a {
            display: inline-block;
            background: var(--accent);
            color: var(--white);
            font-weight: 600;
            padding: 14px 28px;
            border-radius: 8px;
            text-decoration: none;
        }
        a:hover { background: #1d4ed8; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Aanvraag ontvangen</h1>
        <p>We nemen binnen 24 uur persoonlijk contact met u op om uw AI-Scan in te plannen.</p>
        <a href="/">Terug naar bfi.nl</a>
    </div>
</body>
</html>
